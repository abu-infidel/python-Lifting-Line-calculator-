[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftingline"
version = "1.0.0"
description = "Offline GUI wing calculator based on Prandtl lifting-line theory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "matplotlib>=3.10.7",
    "PySide6>=6.7",
]

[project.optional-dependencies]
maxfidelity = ["neuralfoil>=0.3.3,<0.4", "aerosandbox>=4.2.7,<4.3"]
mcp = ["mcp>=1.25,<2"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
liftingline = "liftingline.__main__:main"

[tool.setuptools.packages.find]
include = ["liftingline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
faulthandler_timeout = 150  # dump every thread's stack if a single test hangs
filterwarnings = [
    "ignore:.*AA_UseHighDpiPixmaps.*:DeprecationWarning",
]
markers = [
    "gui: needs Qt (runs with QT_QPA_PLATFORM=offscreen)",
    "neuralfoil: needs the optional NeuralFoil engine",
    "slow: slower validation / convergence tests",
]
